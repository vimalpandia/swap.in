services:
  # Swap REST API & Realtime Web Service
  - type: web
    name: swap-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LLM_API_KEY
        sync: false

  # Swap Next.js Frontend Web Service
  - type: web
    name: swap-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:web
    startCommand: npm run start --workspace=apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
